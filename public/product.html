<style>

<script>(function(){function go(){var b=document.querySelector(".pd-backbtn"),cr=document.querySelector(".pd-crumbs");if(!b||!cr)return false;cr.insertBefore(b,cr.firstChild);var w=b.parentNode;return true}if(!go()){var n=0,t=setInterval(function(){if(go()||++n>40)clearInterval(t)},50)}})();</script>
<script>(function(){function clean(){var cr=document.querySelector(".pd-crumbs");if(!cr||!cr.querySelector(".pd-backbtn"))return false;var ws=document.querySelectorAll("body > div");for(var i=0;i<ws.length;i++){var w=ws[i];if(w.id!=="product-root"&&w.style.paddingTop==="16px"&&!w.children.length){w.parentNode.removeChild(w)}}return true}if(!clean()){var n=0,t=setInterval(function(){if(clean()||++n>40)clearInterval(t)},50)}})();</script>
</body></html>
